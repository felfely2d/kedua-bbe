<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Story ✨</title>
    <style>
        body { 
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%); 
            margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; font-family: 'Poppins', sans-serif; padding: 20px;
            text-align: center; color: #831843;
        }

        /* LOCK SCREEN */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
            display: flex; align-items: center; justify-content: center; z-index: 99999;
        }

        #main-content { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 360px; }

        .art-card {
            position: relative; width: 280px; height: 280px; background: #fff0f6;
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 25px; box-shadow: 0 10px 20px rgba(219, 39, 119, 0.15); border: 2px solid #f472b6;
        }

        .svg-box {
            position: absolute; width: 85%; height: 85%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 1s ease;
        }

        .hidden-item { opacity: 0; transition: opacity 1.5s ease; display: none; margin-top: 10px; }
        
        #text-1, #text-2 { font-weight: 600; color: #831843; padding: 0 10px; }
        #text-trophy { 
            background: #fff0f6; padding: 20px; border-radius: 20px; 
            border: 2px solid #f472b6; font-size: 0.9rem; text-align: left;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="https://litter.catbox.moe/svyhwe11radymm5s.mp3" type="audio/mpeg"></audio>

    <div id="lock-screen">
        <div style="background:#fff0f6; padding:30px; border-radius:20px; border:2px solid #f472b6;">
            <h2>Password sayang?</h2>
            <input type="password" id="pass-input" style="padding:10px; border-radius:10px; border:1px solid #ccc; width:150px;">
            <button onclick="checkPass()" style="padding:10px 20px; border-radius:10px; border:none; background:#db2777; color:white; margin-top:10px;">Buka</button>
        </div>
    </div>

    <div id="main-content">
        <div class="art-card">
            <div id="svg-box-1" class="svg-box"></div>
            <div id="svg-box-2" class="svg-box"></div>
            <div id="svg-box-3" class="svg-box"></div>
            <div id="svg-box-4" class="svg-box"></div>
        </div>

        <div id="text-1" class="hidden-item">sayanggg nanti kita seperti ini yyaaa</div>
        <div id="text-2" class="hidden-item">nanti kitaa keliling qualitytimee ya sayanggg...</div>
        <div id="text-trophy" class="hidden-item">
            In the game of life, having you by my side is my biggest win. 🏆<br><br>
            Makasih ya udah nemenin hari-hari aku. Kamu bakal selalu jadi pemenang di hati aku! Love you so much!
        </div>
    </div>

    <script>
        const urls = [
            'https://litter.catbox.moe/4zmz1d297boj5g4w.svg', // Vespa
            'https://litter.catbox.moe/rht7cuhltc56jtz1.svg', // Siluet
            'https://litter.catbox.moe/30u43s67ucj41k02.svg', // Baru
            'https://litter.catbox.moe/abf3subax5tmffmj.svg'  // Piala
        ];

        // Load semua SVG
        urls.forEach((url, i) => {
            fetch(url).then(r => r.text()).then(svg => {
                const box = document.getElementById('svg-box-' + (i+1));
                box.innerHTML = svg;
                // Setup drawing style
                box.querySelectorAll('path, polygon, polyline, circle, rect').forEach(p => {
                    const len = p.getTotalLength ? p.getTotalLength() : 500;
                    p.style.stroke = '#831843';
                    p.style.strokeWidth = '2px';
                    p.style.fillOpacity = '0';
                    p.style.strokeDasharray = len;
                    p.style.strokeDashoffset = len;
                    p.style.transition = 'stroke-dashoffset 6s linear, fill-opacity 2s ease 4s';
                });
            });
        });

        function triggerDraw(el) {
            el.style.opacity = "1";
            el.querySelectorAll('path, polygon, polyline, circle, rect').forEach(p => {
                p.style.strokeDashoffset = '0';
                p.style.fillOpacity = '1';
            });
        }

        function checkPass() {
            if (document.getElementById("pass-input").value === "16326") {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("main-content").style.display = "flex";
                document.getElementById("bg-music").play();
                startSequence();
            } else { alert("Salah sayang!"); }
        }

        async function startSequence() {
            const boxes = [
                document.getElementById('svg-box-1'), 
                document.getElementById('svg-box-2'), 
                document.getElementById('svg-box-3'), 
                document.getElementById('svg-box-4')
            ];

            // Step 1
            triggerDraw(boxes[0]);
            await new Promise(r => setTimeout(r, 7000));
            document.getElementById('text-1').style.display = 'block';
            setTimeout(() => document.getElementById('text-1').style.opacity = '1', 100);
            await new Promise(r => setTimeout(r, 3000));

            // Step 2
            boxes[0].style.opacity = '0';
            await new Promise(r => setTimeout(r, 1000));
            triggerDraw(boxes[1]);
            await new Promise(r => setTimeout(r, 7000));
            document.getElementById('text-2').style.display = 'block';
            setTimeout(() => document.getElementById('text-2').style.opacity = '1', 100);
            await new Promise(r => setTimeout(r, 3000));

            // Step 3
            boxes[1].style.opacity = '0';
            await new Promise(r => setTimeout(r, 1000));
            triggerDraw(boxes[2]);
            await new Promise(r => setTimeout(r, 7000));
            boxes[2].style.opacity = '0';
            await new Promise(r => setTimeout(r, 1000));

            // Step 4 (Piala)
            triggerDraw(boxes[3]);
            await new Promise(r => setTimeout(r, 7000));
            document.getElementById('text-trophy').style.display = 'block';
            setTimeout(() => document.getElementById('text-trophy').style.opacity = '1', 100);
        }
    </script>
</body>
</html>
